name: "Issue"
description: "Use this template to file a clear, actionable issue."
title: "[Type] Short summary"
labels: []
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: |
        Clearly describe the problem, request, or question. Include the why (motivation or impact) and any relevant links.
        If this is a bug, prefer a minimal, reproducible example.
      placeholder: |
        What is happening? Why is this important? What would success look like?
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to reproduce (if applicable)
      description: Exact steps to reproduce the issue. Include code snippets, console output, or screenshots.
      placeholder: |
        1.
        2.
        3.

  - type: input
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect to happen?

  - type: input
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What actually happened?

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Runtime details that might be relevant.
      placeholder: |
        OS: macOS 14
        Node: 20.x
        Browser: Chrome 121

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context / Screenshots
      description: Any other context, ideas, or screenshots that might help.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: I provided a clear description with context and acceptance criteria where possible.
          required: true

